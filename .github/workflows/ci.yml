name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Typecheck runs first: this gate exists so a type error cannot reach
      # production the way the broken import path in UserDashboard did.
      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # A critical advisory in something that ships to visitors stops the
      # build. This step used to be allowed to fail, so it never stopped
      # anything — a critical one in the HTML sanitiser sat there unnoticed.
      # High ones are still reported below without failing: the two that
      # remain come through the Firebase SDK and have no upstream fix yet.
      - run: npm audit --omit=dev --audit-level=critical

      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      # Security rules are the only thing standing between the database and
      # the open internet, so they get tested like code.
      - run: npx firebase-tools@13.29.1 emulators:exec --only firestore --project sanad-rules-test "npm run test:rules"
