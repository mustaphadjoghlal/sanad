<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Sanad Portfolio Reel</title>
<style>
  @font-face { font-family: "Cairo"; font-weight: 700; src: url(fonts/cairo-arabic-700-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
  @font-face { font-family: "Cairo"; font-weight: 800; src: url(fonts/cairo-arabic-800-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
  @font-face { font-family: "Cairo"; font-weight: 900; src: url(fonts/cairo-arabic-900-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
  @font-face { font-family: "Cairo"; font-weight: 700; src: url(fonts/cairo-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }
  @font-face { font-family: "Cairo"; font-weight: 800; src: url(fonts/cairo-latin-800-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }
  @font-face { font-family: "Cairo"; font-weight: 900; src: url(fonts/cairo-latin-800-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }
  @font-face { font-family: "Tajawal"; font-weight: 500; src: url(fonts/tajawal-arabic-500-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
  @font-face { font-family: "Tajawal"; font-weight: 700; src: url(fonts/tajawal-arabic-700-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }

  html, body { margin: 0; padding: 0; background: #000; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 40%, #0b1d13 0%, #06110b 55%, #030805 100%);
    font-family: "Cairo", sans-serif; color: #fff; direction: rtl;
  }
  .a { position: absolute; left: 0; top: 0; will-change: transform, opacity; white-space: nowrap; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #grid { background-image: radial-gradient(rgba(255,255,255,0.07) 1.6px, transparent 1.8px); background-size: 54px 54px; }
  .glow { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; left: -160px; }
  #glowG { background: radial-gradient(circle, rgba(0,196,106,0.35) 0%, rgba(0,163,85,0.12) 35%, transparent 65%); }
  #glowW { background: radial-gradient(circle, rgba(255,214,120,0.22) 0%, rgba(180,120,0,0.08) 35%, transparent 65%); }
  #vignette { background: radial-gradient(75% 60% at 50% 50%, transparent 55%, rgba(0,0,0,0.65) 100%); }
  .dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #2ee6a0; }

  .h { font-weight: 900; text-align: center; line-height: 1.3; white-space: normal; width: 980px; }
  .h .w { display: inline-block; }
  .acc { background: linear-gradient(90deg, #2ee6a0, #00c46a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .gold { background: linear-gradient(90deg, #fde68a, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .t { font-family: "Tajawal", "Cairo"; }

  /* scattered items (scene 2) */
  .item { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 34px 40px; border-radius: 40px;
    background: #141a16; border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
  .item .ib { width: 140px; height: 140px; border-radius: 36px; background: #222a25; display: flex; align-items: center; justify-content: center; }
  .item .il { font-family: "Tajawal","Cairo"; font-weight: 700; font-size: 34px; color: #9aa59f; }
  .file { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-radius: 20px; background: rgba(255,255,255,0.05);
    font-family: "Cairo"; font-weight: 700; font-size: 26px; color: #7f8a84; direction: ltr; }

  /* phone */
  .phone { width: 760px; height: 1180px; border-radius: 92px; background: #050706; padding: 14px; box-sizing: border-box;
    box-shadow: 0 0 0 3px #222a25, 0 50px 140px rgba(0,0,0,0.7), 0 0 120px rgba(0,163,85,0.18); }
  .screen { position: relative; width: 732px; height: 1152px; border-radius: 78px; overflow: hidden; background: #0e0e0e; }
  .notch { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 170px; height: 40px; border-radius: 20px; background: #000; z-index: 5; }
  .sitebar { position: absolute; top: 0; left: 0; right: 0; height: 120px; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 40px 16px; box-sizing: border-box; background: #0b130e; border-bottom: 1px solid rgba(46,230,160,0.12); z-index: 4; }
  .view { position: absolute; left: 0; top: 120px; width: 732px; height: 1032px; }
  .abs { position: absolute; }

  .sbtn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; border-radius: 22px; font-weight: 800; font-size: 28px; }
  .green { background: linear-gradient(135deg, #00a355, #00c46a); color: #fff; }
  .ghost { background: rgba(46,230,160,0.1); color: #b6f0d2; border: 1.5px solid rgba(46,230,160,0.3); }
  .lbl { font-family: "Tajawal","Cairo"; font-weight: 700; font-size: 26px; color: #81c784; }
  .inp { border-radius: 20px; background: rgba(46,230,160,0.06); border: 1.5px solid rgba(46,230,160,0.2); box-sizing: border-box;
    padding: 0 24px; display: flex; align-items: center; font-family: "Tajawal","Cairo"; font-weight: 500; font-size: 28px; color: #e8f5e9; }
  .inp.focus { border-color: #2ee6a0; box-shadow: 0 0 0 4px rgba(46,230,160,0.15); }
  .chip { position: absolute; height: 64px; border-radius: 32px; display: flex; align-items: center; justify-content: center; gap: 8px;
    font-weight: 800; font-size: 26px; color: #9fd8b9; background: rgba(46,230,160,0.06); border: 1.5px solid rgba(46,230,160,0.2); box-sizing: border-box; }
  .chip.on { background: linear-gradient(135deg, #00a355, #00c46a); color: #fff; border-color: transparent; }
  .cursor { display: inline-block; width: 3px; height: 34px; background: #2ee6a0; vertical-align: middle; margin-right: 3px; }
  .toast { padding: 20px 34px; border-radius: 26px; background: #0f2a1b; border: 2px solid rgba(46,230,160,0.5); color: #b6f0d2;
    font-weight: 800; font-size: 30px; display: inline-flex; align-items: center; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }

  /* work card, as the site draws it */
  .wcard { position: absolute; width: 324px; border-radius: 28px; overflow: hidden; background: rgba(0,163,85,0.08); border: 1.5px solid rgba(0,163,85,0.18); }
  .wcover { position: relative; height: 202px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .wtype { position: absolute; bottom: 12px; left: 12px; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 12px;
    background: rgba(0,0,0,0.65); font-size: 19px; font-weight: 700; color: #e8f5e9; }
  .wfeat { position: absolute; top: 12px; right: 12px; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 12px;
    background: rgba(180,120,0,0.92); font-size: 19px; font-weight: 800; color: #fff; }
  .wbody { padding: 14px 18px 16px; }
  .wtitle { font-size: 25px; font-weight: 800; line-height: 1.5; white-space: normal; height: 75px; overflow: hidden; color: #e8f5e9; }
  .wowner { font-family: "Tajawal","Cairo"; font-weight: 500; font-size: 20px; color: #6aad6a; margin-top: 2px; }
  .wstats { display: flex; gap: 20px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(0,163,85,0.12); font-size: 20px; font-weight: 700; color: #6aad6a; }
  .wstats span { display: inline-flex; align-items: center; gap: 6px; }
  .newtag { position: absolute; top: 12px; left: 12px; padding: 6px 14px; border-radius: 12px; background: #2ee6a0; color: #04210f; font-weight: 900; font-size: 19px; }
  .bars { display: flex; align-items: center; gap: 7px; height: 110px; }
  .bars i { width: 9px; border-radius: 5px; background: rgba(255,255,255,0.9); display: block; }

  /* tips */
  .tip { width: 900px; height: 160px; display: flex; align-items: center; gap: 28px; padding: 0 30px; box-sizing: border-box; border-radius: 40px;
    background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03)); border: 2px solid rgba(46,230,160,0.2); }
  .tnum { width: 74px; height: 74px; border-radius: 50%; background: rgba(46,230,160,0.14); color: #2ee6a0; font-size: 40px; font-weight: 900;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 2px solid rgba(46,230,160,0.45); }
  .ttile { width: 100px; height: 100px; border-radius: 28px; background: linear-gradient(135deg, #006233, #00a355 60%, #2ee6a0);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ttl { font-size: 46px; font-weight: 900; line-height: 1.2; }
  .tsub { font-family: "Tajawal","Cairo"; font-weight: 500; font-size: 30px; color: #9fd8b9; margin-top: 2px; }

  .ring { width: 420px; height: 420px; border-radius: 50%; border: 4px solid rgba(46,230,160,0.8); }
  .tap { width: 74px; height: 74px; border-radius: 50%; background: rgba(255,255,255,0.85); box-shadow: 0 0 0 10px rgba(255,255,255,0.18), 0 10px 30px rgba(0,0,0,0.5); }
  .ripple { width: 74px; height: 74px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.9); }
  .path { padding: 18px 34px; border-radius: 30px; background: rgba(46,230,160,0.08); border: 2px solid rgba(46,230,160,0.35);
    font-family: "Tajawal","Cairo"; font-weight: 700; font-size: 36px; color: #c9f5dd; }
  .url { padding: 18px 54px; border-radius: 50px; border: 3px solid rgba(46,230,160,0.6); background: rgba(46,230,160,0.08);
    font-size: 52px; font-weight: 800; color: #e9fff3; direction: ltr; }
  .spark { width: 14px; height: 14px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 18px #fbbf24; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg">
    <div class="glow" id="glowG"></div>
    <div class="glow" id="glowW"></div>
    <div class="layer" id="grid"></div>
    <div class="layer" id="dots"></div>
  </div>
  <div class="layer" id="fx"></div>
  <div class="layer" id="vignette"></div>
</div>
<script src="icons.js"></script>
<script>
const stage = document.getElementById("stage");
const fx = document.getElementById("fx");
const W = 1080, H = 1920, CX = 540;

// ── math ────────────────────────────────────────────────────────────
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, s, d) => cl((t - s) / d);
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2));
const win = (t, a, b, fi = 0.3, fo = 0.3) => eo(p(t, a, fi)) * (1 - eio(p(t, b - fo, fo)));
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const ic = (n, size, color = "#fff", sw = 2.2, fill = "none") =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
/** As the site prints counts: 1200 → "1.2 ألف". */
const short = (n) => (n < 1000 ? String(Math.round(n)) : `${(n / 1000).toFixed(1).replace(/\.0$/, "")} ألف`);

// ── element registry ───────────────────────────────────────────────
const anims = [], subs = [];
function A(html, fn, cls = "", parent = fx) {
  const d = document.createElement("div");
  d.className = "a " + cls;
  d.innerHTML = html;
  parent.appendChild(d);
  anims.push({ d, fn });
  return d;
}
function apply(d, s) {
  if (!s || s.o <= 0.002) { d.style.display = "none"; return; }
  d.style.display = "";
  d.style.opacity = s.o;
  d.style.transform = `translate(${s.x}px, ${s.y}px) translate(-50%, -50%) rotate(${s.r || 0}deg) scale(${s.s ?? 1})`;
  d.style.filter = s.b > 0.05 ? `blur(${s.b}px)` : "none";
}
/** Styles a node inside a screen; o/x/y/s optional. */
function put(el, { o = 1, x = 0, y = 0, s = 1 } = {}) {
  el.style.opacity = o;
  el.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  el.style.visibility = o <= 0.002 ? "hidden" : "visible";
}

/** A line of text whose words rise in one after another, and leave together. */
function headline(text, o) {
  const { y, size = 88, start, end, color = "#fff", hl = [], gold = [], out = 0.35, x = CX } = o;
  const html = text.split(" ").map((w) => (w === "|" ? "<br>" : `<span class="w ${hl.includes(w) ? "acc" : gold.includes(w) ? "gold" : ""}">${w}</span>`)).join(" ");
  const d = A(`<div class="h" style="font-size:${size}px;color:${color}">${html}</div>`, (t) => {
    if (t < start - 0.05 || t > end + out) return null;
    const k = eio(p(t, end, out));
    return { x, y: y - k * 50, o: 1 - k, b: k * 14, s: 1 - k * 0.04 };
  });
  const spans = [...d.querySelectorAll(".w")];
  subs.push((t) => spans.forEach((sp, i) => {
    const k = eo(p(t, start + i * 0.09, 0.5));
    sp.style.opacity = k;
    sp.style.transform = `translateY(${(1 - k) * 60}px)`;
    sp.style.filter = k < 0.98 ? `blur(${(1 - k) * 12}px)` : "none";
  }));
  return d;
}

// ── background ─────────────────────────────────────────────────────
const dotsEl = document.getElementById("dots");
const R = rng(11);
const dots = Array.from({ length: 40 }, () => {
  const d = document.createElement("div"); d.className = "dot"; dotsEl.appendChild(d);
  return { d, x: R() * W, y: R() * H, v: 20 + R() * 50, s: 0.4 + R() * 1.2, ph: R() * 6.28 };
});
const glowG = document.getElementById("glowG"), glowW = document.getElementById("glowW"), grid = document.getElementById("grid");
function bg(t) {
  // Scene 2 is the dull "before"; the gold glow belongs to the featured moment.
  const dull = p(t, 3.4, 0.6) * (1 - p(t, 7.6, 0.6));
  const gold = p(t, 44.0, 0.6) * (1 - p(t, 47.4, 0.5));
  glowG.style.opacity = (1 - dull * 0.8) * (0.85 + 0.15 * Math.sin(t * 1.3));
  glowG.style.transform = `translate(${Math.sin(t * 0.4) * 60}px, ${180 + Math.cos(t * 0.33) * 80}px)`;
  glowW.style.opacity = gold;
  glowW.style.transform = `translate(0px, ${300 + Math.sin(t * 0.8) * 40}px)`;
  grid.style.backgroundPosition = `0px ${(t * 22) % 54}px`;
  grid.style.opacity = 0.9 - dull * 0.5;
  for (const q of dots) {
    const y = ((q.y - t * q.v) % H + H) % H;
    q.d.style.transform = `translate(${q.x + Math.sin(t * 0.8 + q.ph) * 14}px, ${y}px) scale(${q.s})`;
    q.d.style.opacity = (0.15 + 0.35 * (0.5 + 0.5 * Math.sin(t * 2 + q.ph))) * (1 - dull * 0.7);
  }
}

// ═══ Scene 1 — the hook (0 – 3.4) ════════════════════════════════════
A(`<div style="width:900px;height:900px;border-radius:50%;background:radial-gradient(circle, rgba(220,255,236,0.22) 0%, rgba(46,230,160,0.1) 35%, transparent 65%)"></div>`, (t) => {
  if (t > 3.7) return null;
  const k = eo(p(t, 0, 1.2)), out = eio(p(t, 3.0, 0.5));
  return { x: lerp(200, CX, k), y: lerp(1500, 900, k), o: k * (1 - out), s: 0.8 + 0.3 * k };
});
headline("أعمالك تستحق | أن تُرى.", { y: 900, start: 0.25, end: 3.1, size: 128, hl: ["تُرى."] });

// ═══ Scene 2 — where work lives now (3.4 – 7.6) ══════════════════════
headline("تقريرٌ في هاتفك…", { y: 420, start: 3.45, end: 4.75, size: 96 });
headline("تسجيلٌ في حاسوبك…", { y: 420, start: 4.85, end: 6.05, size: 96 });
headline("ورابطٌ ضائع | في مجموعة.", { y: 400, start: 6.15, end: 7.45, size: 96 });

const scattered = [
  { html: `<div class="item"><div class="ib">${ic("smartphone", 80, "#7f8a84", 1.8)}</div><div class="file">${ic("video", 30, "#7f8a84")} VID_20240311.mp4</div></div>`,
    st: 3.55, from: [CX, 1000], to: [300, 980], r: -7 },
  { html: `<div class="item"><div class="ib">${ic("folder", 80, "#7f8a84", 1.8)}</div><div class="file">${ic("mic", 30, "#7f8a84")} final_v3_new.wav</div></div>`,
    st: 4.95, from: [CX, 1050], to: [780, 1180], r: 6 },
  { html: `<div class="item"><div class="ib">${ic("message-circle", 80, "#7f8a84", 1.8)}</div><div class="file">${ic("link", 30, "#7f8a84")} youtu.be/…</div><div class="il">+342 رسالة بعده</div></div>`,
    st: 6.25, from: [CX, 1100], to: [420, 1480], r: -4 },
];
scattered.forEach(({ html, st, from, to, r }, i) => {
  A(html, (t) => {
    if (t < st || t > 10.0) return null;
    const k = back(p(t, st, 0.55));
    const settle = eio(p(t, st + 1.2, 0.6));
    // Scene 3: everything is gathered into one frame in the centre.
    const g = eio(p(t, 7.75 + i * 0.12, 0.7));
    const x = lerp(lerp(from[0], to[0], settle), CX, g), y = lerp(lerp(from[1], to[1], settle), 1060, g);
    return { x, y, o: cl(k * 1.4) * (1 - p(t, 8.35 + i * 0.12, 0.25)), s: (0.6 + 0.4 * k) * lerp(1, 0.25, g) * lerp(1, 0.8, settle), r: r * settle };
  });
});

// ═══ Scene 3 — one place (7.6 – 10.2) ════════════════════════════════
headline("اجمعها كلّها | في مكانٍ واحد.", { y: 420, start: 7.65, end: 9.95, size: 92, hl: ["واحد."] });
[0, 1].forEach((i) => A(`<div class="ring"></div>`, (t) => {
  const st = 8.4 + i * 0.3;
  if (t < st || t > st + 1.5) return null;
  const k = eo(p(t, st, 1.5));
  return { x: CX, y: 1060, o: (1 - k) * 0.8, s: 0.4 + k * 1.6 };
}));
A(`<div style="display:flex;flex-direction:column;align-items:center;gap:26px">
     <div style="width:200px;height:200px;border-radius:56px;background:linear-gradient(135deg,#006233,#00a355 60%,#2ee6a0);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 80px rgba(0,163,85,0.5)">${ic("layers", 110, "#fff", 2)}</div>
     <div style="font-size:104px;font-weight:900">معرض الأعمال</div>
     <div style="display:flex;align-items:center;gap:16px;font-size:40px;font-weight:800;color:#9fd8b9">على <img src="logo.png" style="height:64px" /></div>
   </div>`, (t) => {
  if (t < 8.35 || t > 10.3) return null;
  const k = back(p(t, 8.4, 0.65)), out = eio(p(t, 9.85, 0.4));
  return { x: CX, y: 1060 - out * 60, o: cl(k * 1.5) * (1 - out), s: (0.5 + 0.5 * k) * (1 - out * 0.1), b: out * 12 };
});

// ═══ The phone (10.2 – 31.9) ════════════════════════════════════════
const phone = A(`<div class="phone"><div class="screen" id="scr">
  <div class="notch"></div>
  <div class="sitebar"><img src="logo.png" style="height:52px" />${ic("bell", 40, "#9fd8b9", 2)}</div>
  <div class="view" id="v1"></div><div class="view" id="v2"></div><div class="view" id="v3"></div><div class="view" id="v4"></div>
</div></div>`, (t) => {
  if (t < 10.15 || t > 32.0) return null;
  const k = eo(p(t, 10.2, 0.6)), out = eio(p(t, 31.45, 0.45));
  return { x: CX, y: 1060 + (1 - k) * 260 + out * 120 + Math.sin(t * 1.2) * 5, o: k * (1 - out), s: (0.9 + 0.1 * k) * (1 - out * 0.08), b: out * 10 };
});
const $ = (id) => document.getElementById(id);
// Screen coordinates → stage coordinates, while the phone sits at rest.
const SX = (x) => 174 + x, SY = (y) => 484 + y + 120;

/** Which screen is showing: a short slide between them. */
function screenSwitch(t, el, a, b, dir = 1) {
  const i = eo(p(t, a, 0.45)), o = eio(p(t, b - 0.45, 0.45));
  // display, not visibility: a child set visible would show through a hidden parent
  if (t < a - 0.01 || t > b + 0.01) { el.style.display = "none"; return; }
  el.style.display = "";
  put(el, { o: Math.min(i, 1 - o), x: (1 - i) * 120 * dir - o * 120 * dir });
}

headline("كيف تستغلّه | أفضل استغلال؟", { y: 360, start: 31.75, end: 43.55, size: 92, hl: ["أفضل", "استغلال؟"] });
const TIPS = [
  ["pencil", "عنوانٌ واضح", "يقول ما هو العمل من أول نظرة"],
  ["image", "غلافٌ جذّاب", "أول ما تقع عليه عين الزائر"],
  ["file-text", "وصفٌ قصير", "دورك، والجهة، والسنة"],
  ["layers", "نوّع أعمالك", "فيديو، وصوت، وصور، ومقالات"],
  ["share-2", "شارك رابط ملفك", "في سيرتك الذاتية وعلى مواقع التواصل"],
];
TIPS.forEach(([icon, title, sub], i) => {
  const st = 33.1 + i * 2.0, y = 640 + i * 188;
  A(`<div class="tip"><div class="tnum">${i + 1}</div><div class="ttile">${ic(icon, 54, "#fff", 2.2)}</div><div><div class="ttl">${title}</div><div class="tsub">${sub}</div></div></div>`, (t) => {
    if (t < st || t > 44.0) return null;
    const k = eo(p(t, st, 0.6)), out = eio(p(t, 43.4 + i * 0.05, 0.4));
    // the tip being talked about is lit; the ones before it step back a little
    const next = i < TIPS.length - 1 ? 33.1 + (i + 1) * 2.0 : 99;
    const dim = lerp(1, 0.55, eo(p(t, next, 0.4)));
    return { x: CX + (1 - k) * 300 - out * 200, y, o: cl(k * 1.3) * (1 - out) * dim, s: 0.94 + 0.06 * k, b: (1 - k) * 8 + out * 8 };
  });
});

// ═══ Scene 9 — picked for the front page (44.0 – 47.6) ═══════════════
headline("أفضل الأعمال تُختار | لواجهة المنصة", { y: 380, start: 44.1, end: 47.35, size: 88, gold: ["تُختار"] });
const big = A(`<div class="wcard" style="position:relative;width:540px;border-color:rgba(251,191,36,0.6);box-shadow:0 0 70px rgba(251,191,36,0.25)">${workCard(WORKS[0]).replace('<div class="wtype"', '<div class="wfeat" id="bigStar" style="font-size:30px;padding:10px 20px">' + ic("star", 28, "#fff", 2, "#fff") + ' مختار</div><div class="wtype"')}</div>`, (t) => {
  if (t < 44.3 || t > 47.7) return null;
  const k = back(p(t, 44.35, 0.6)), out = eio(p(t, 47.25, 0.4));
  return { x: CX, y: 1060 - out * 40, o: cl(k * 1.5) * (1 - out), s: (0.7 + 0.3 * k) * 1.45, r: (1 - cl(k)) * -6, b: out * 10 };
});
// The site's card is sized for a grid; the big one scales its text with it.
big.querySelectorAll(".wcover")[0].style.height = "336px";
subs.push((t) => {
  const st = big.querySelector("#bigStar");
  const k = p(t, 45.0, 0.25);
  st.style.opacity = k > 0 ? 1 : 0;
  st.style.transform = `scale(${lerp(2.6, 1, eo(k))}) rotate(${lerp(-20, 0, eo(k))}deg)`;
});
Array.from({ length: 14 }, (_, i) => i).forEach((i) => A(`<div class="spark"></div>`, (t) => {
  const st = 45.1 + (i % 3) * 0.05;
  if (t < st || t > st + 1.1) return null;
  const k = eo(p(t, st, 1.1)), a = (i / 14) * Math.PI * 2;
  return { x: 790 + Math.cos(a) * 260 * k, y: 760 + Math.sin(a) * 220 * k, o: 1 - p(t, st + 0.4, 0.7), s: 1 - 0.6 * k };
}));
A(`<div class="path" style="font-size:32px;color:#fde68a;border-color:rgba(251,191,36,0.4);background:rgba(251,191,36,0.08)">${ic("star", 34, "#fbbf24", 2, "#fbbf24")} وتظهر في مختارات المنصة على الصفحة الرئيسية</div>`, (t) => {
  if (t < 45.6 || t > 47.7) return null;
  const k = eo(p(t, 45.65, 0.5)), out = eio(p(t, 47.25, 0.4));
  return { x: CX, y: 1560, o: k * (1 - out), s: 0.96 + 0.04 * k };
});

// ═══ Scene 10 — the ask (47.6 – end) ═════════════════════════════════
[0, 1].forEach((i) => A(`<div class="ring"></div>`, (t) => {
  const st = 47.75 + i * 0.35;
  if (t < st || t > st + 1.6) return null;
  const k = eo(p(t, st, 1.6));
  return { x: CX, y: 600, o: (1 - k) * 0.8, s: 0.45 + k * 1.5 };
}));
A(`<img src="icon-512.png" style="width:280px;height:280px;display:block" />`, (t) => {
  if (t < 47.7) return null;
  const k = back(p(t, 47.75, 0.6));
  return { x: CX, y: 600 + Math.sin(t * 2.2) * 6, o: cl(k * 1.6), s: 0.3 + 0.7 * k };
});
const wm = A(`<img src="logo.png" style="width:520px;display:block;filter:drop-shadow(0 0 36px rgba(46,230,160,0.5))" />`, (t) => (t < 48.0 ? null : { x: CX, y: 830, o: 1 }));
subs.push((t) => { wm.firstChild.style.clipPath = `inset(0 0 0 ${(1 - eo(p(t, 48.0, 0.65))) * 100}%)`; });
headline("انشر عملك الأول | اليوم", { y: 1040, start: 48.5, end: 99, size: 92, hl: ["اليوم"] });
A(`<div class="path">لوحة التحكم ← أعمالي في المعرض ← نشر عمل</div>`, (t) => {
  if (t < 49.2) return null;
  const k = eo(p(t, 49.25, 0.5));
  return { x: CX, y: 1250 + (1 - k) * 30, o: k };
});
A(`<div class="url">sanadz.media</div>`, (t) => {
  if (t < 49.7) return null;
  const k = back(p(t, 49.75, 0.55));
  const pulse = 1 + 0.025 * Math.sin((t - 50) * 3.2) * p(t, 50.4, 0.5);
  return { x: CX, y: 1410, o: cl(k * 1.5), s: (0.6 + 0.4 * k) * pulse };
});

// ── render ─────────────────────────────────────────────────────────
window.DURATION = 52.0;
window.render = (t) => {
  bg(t);
  for (const { d, fn } of anims) apply(d, fn(t));
  for (const s of subs) s(t);
  stage.style.opacity = Math.min(p(t, 0, 0.25), 1 - p(t, window.DURATION - 0.35, 0.35));
};
window.ready = (async () => {
  const faces = ["700 40px Cairo", "800 40px Cairo", "900 40px Cairo", "500 40px Tajawal", "700 40px Tajawal"];
  await Promise.all(faces.flatMap((f) => [document.fonts.load(f, "سند الإعلام"), document.fonts.load(f, "sanadz.media 123…←")]));
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => (im.onload = r)))));
  window.render(0);
  return true;
})();
</script>
</body>
